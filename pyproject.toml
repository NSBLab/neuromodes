[project]
name = "neuromodes"
version = "0.1.0"
description = "Eigenmode-based brain mapping and modelling toolbox developed by the Neural Systems and Behaviour Lab"
readme = "README.rst"
requires-python = ">=3.10"
keywords = ["python", "modelling", "neuroimaging", "eigenmodes", "brain-mapping"]

dependencies = [
    "lapy>=1.6.0",
    "nibabel>=5.2.1",
    "numpy>=1.24.4",
    "scipy>=1.10.1",
]

[project.optional-dependencies]
cache = [
    "joblib>=1.5.3",
]
testing = [
    "pytest>=8.4.2",
]
tutorials = [
    "ipykernel>=6.31.0",
    "matplotlib>=3.9.4",
    "nsbutils @ git+https://github.com/NSBLab/nsbutils.git@dev",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["neuromodes", "neuromodes.data"]

[tool.setuptools.package-data]
"neuromodes.data" = ["*"]

[tool.pytest.ini_options]
python_functions = ["test_"]
python_files = ["test_*.py",]
testpaths = ["tests",]

[dependency-groups]
tox = [
    "tox>=4.0",
]

[tool.tox]
requires = ["tox>=4.0"]
env_list = ["py310", "py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
extras = ["testing", "cache"]
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }]]

[project.urls]
"Homepage" = "https://neuromodes.readthedocs.io"
